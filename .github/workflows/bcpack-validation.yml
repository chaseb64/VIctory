name: BCPack Windows verification
on:
  push:
    branches: ['validation/bcpack-audit/**']

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'chaseb64/VIctory' && github.event.repository.fork && !github.event.repository.private
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Test the parent revision on native Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $source = git rev-parse HEAD^
          if ($LASTEXITCODE -ne 0) { throw 'Source commit unavailable' }
          git checkout --detach $source
          if ($LASTEXITCODE -ne 0 -or (git rev-parse HEAD) -ne $source) { throw 'Source checkout failed' }
          $dir = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/bcpack-evidence"
          @("source=$source", "workflow=$env:GITHUB_SHA", "attempt=$env:GITHUB_RUN_ATTEMPT",
            "run=$env:GITHUB_RUN_ID", "image=$env:ImageVersion") | Set-Content "$dir/provenance.txt"
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { throw 'Pinned toolchain installation failed' }
          rustc -Vv | Tee-Object "$dir/toolchain.log"
          $checks = [ordered]@{
            'formats' = @('test', '-p', 'victory-formats', '--locked')
            'dstorage' = @('test', '-p', 'victory-hle', '--locked', 'modules::dstorage::tests::')
            'clippy' = @('clippy', '--workspace', '--all-targets', '--locked', '--', '-D', 'warnings')
            'clippy-diagnostics' = @('clippy', '--workspace', '--all-targets', '--all-features', '--locked', '--', '-D', 'warnings')
            'workspace' = @('test', '--workspace', '--locked')
            'policy' = @('xtask', 'policy')
          }
          $failed = @()
          foreach ($label in $checks.Keys) {
            $arguments = $checks[$label]
            & cargo @arguments 2>&1 | ForEach-Object { $_.ToString() } | Tee-Object "$dir/$label.log"
            $code = $LASTEXITCODE
            if ($label -in @('formats','dstorage') -and !(Select-String -Quiet -Path "$dir/$label.log" -Pattern 'test result: ok\. [1-9][0-9]* passed')) {
              $code = 1
            }
            "$label=$code" | Add-Content "$dir/results.txt"
            if ($code -ne 0) { $failed += $label }
          }
          if ($failed.Count) { throw "Failed checks $failed" }
      - name: Upload native test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bcpack-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bcpack-evidence/
          retention-days: 1
          if-no-files-found: error
