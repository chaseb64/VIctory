name: Windows contribution validation

on:
  push:
    branches: [validation/windows-contributions, "validation/windows-contributions/**"]
  workflow_dispatch:
    inputs:
      suite:
        description: Choose contribution-specific checks or a two-commit workspace comparison
        type: choice
        options:
          - contributions
          - workspace
        default: contributions
      upstream_base:
        description: Full baseline commit (upstream pre-layout commit for contributions)
        type: string
        required: true
        default: '940d32f69b22265690a0b5a15d6ded572ba33baf'
      guest_layout:
        description: Full guest layout commit and sampled R4G4 parent
        type: string
        required: true
        default: '5c16c766033e4052f09a446372c47238d8193cf5'
      host_candidate:
        description: Full candidate commit (sampled R4G4 for contributions)
        type: string
        required: true
        default: 'f4d71531b5d7fb868ee65b5dd5e7574695e6c980'
      wave_candidate:
        description: Full nested Wave32 checker candidate commit
        type: string
        required: true
        default: 'd35bfafadd107c844fa3d76c6ad7b0cbb46333d6'

permissions:
  contents: read

concurrency:
  group: windows-contribution-validation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event.repository.fork == true && github.event.repository.private == false && github.repository == 'chaseb64/VIctory' }}
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Record workflow provenance
        run: |
          $evidence = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/victory-windows-evidence"
          "repository=$env:GITHUB_REPOSITORY workflow_sha=$env:GITHUB_SHA run_id=$env:GITHUB_RUN_ID attempt=$env:GITHUB_RUN_ATTEMPT" |
            Set-Content -LiteralPath (Join-Path $evidence.FullName 'workflow.txt')

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          repository: ${{ github.repository }}
          fetch-depth: 0
          persist-credentials: false

      - name: Probe native WARP capability
        if: ${{ github.event_name == 'push' || inputs.suite == 'contributions' }}
        timeout-minutes: 10
        run: |
          ./scripts/windows-validation/probe-warp.ps1 `
            -OutputDirectory "$env:RUNNER_TEMP/victory-windows-evidence/warp-probe"

      - name: Run selected Windows validation suite
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        timeout-minutes: 105
        env:
          VALIDATION_SUITE: ${{ inputs.suite || 'contributions' }}
          UPSTREAM_BASE: ${{ inputs.upstream_base || '940d32f69b22265690a0b5a15d6ded572ba33baf' }}
          GUEST_LAYOUT: ${{ inputs.guest_layout || '5c16c766033e4052f09a446372c47238d8193cf5' }}
          HOST_CANDIDATE: ${{ inputs.host_candidate || 'f4d71531b5d7fb868ee65b5dd5e7574695e6c980' }}
          WAVE_CANDIDATE: ${{ inputs.wave_candidate || 'd35bfafadd107c844fa3d76c6ad7b0cbb46333d6' }}
        run: |
          ./scripts/windows-validation/validate.ps1 `
            -Suite $env:VALIDATION_SUITE `
            -UpstreamBase $env:UPSTREAM_BASE `
            -GuestLayout $env:GUEST_LAYOUT `
            -HostCandidate $env:HOST_CANDIDATE `
            -WaveCandidate $env:WAVE_CANDIDATE `
            -EvidenceDir "$env:RUNNER_TEMP/victory-windows-evidence" `
            -WorkDir "$env:RUNNER_TEMP/victory-validation"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: victory-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/victory-windows-evidence/
          retention-days: 7
          if-no-files-found: warn
