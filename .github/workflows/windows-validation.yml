name: Windows validation

on:
  push:
    branches: ['validation/windows-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Windows CPU, workspace, Clippy and asset policy
        shell: pwsh
        run: ./scripts/windows-validation/run.ps1 -Suite Checks -OutputDirectory "$env:RUNNER_TEMP/victory-checks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-checks
          path: ${{ runner.temp }}/victory-checks/
          if-no-files-found: error
          retention-days: 14

  r4g4:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Native D3D12 R4G4 and matched host-format control
        shell: pwsh
        run: ./scripts/windows-validation/run.ps1 -Suite R4G4 -OutputDirectory "$env:RUNNER_TEMP/victory-r4g4" -InstallGraphicsTools
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-r4g4
          path: ${{ runner.temp }}/victory-r4g4/
          if-no-files-found: error
          retention-days: 14
